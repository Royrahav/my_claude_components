<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* layout: a working tool. Header with the change at a glance, then one architecture map as the canvas and a side panel whose content follows the tab (map, simulator, files, commits) */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface2: #eef2f8; --ink: #0f1b2d; --muted: #5b6b82; --line: #d6dde8;
  --accent: #2459d6; --accent-soft: #e3ebfc; --accent-ink: #ffffff;
  --new: #13895c; --new-soft: #dcf3e8; --chg: #b26b00; --chg-soft: #fbedd5; --ext: #6c7a90; --ext-soft: #eceff4;
  --bad: #c2362b; --bad-soft: #fbe1de; --pulse: rgba(36, 89, 214, 0.35);
  --bar-h: 58px; --plate: transparent; --plate-pad: 0;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111a; --surface: #131a26; --surface2: #182131; --ink: #e6ecf5; --muted: #93a2b8; --line: #263247;
    --accent: #6f9bff; --accent-soft: #1a2a4a; --accent-ink: #081225;
    --new: #43c98f; --new-soft: #12301f; --chg: #f0ad3a; --chg-soft: #33270f; --ext: #8f9cb0; --ext-soft: #1b2230;
    --bad: #f07a6e; --bad-soft: #3a1b18; --pulse: rgba(111, 155, 255, 0.4); color-scheme: dark;
    --plate: #f7f9f8; --plate-pad: 0.35em 0.6em;
  }
}
:root[data-theme="dark"] {
  --plate: #f7f9f8; --plate-pad: 0.35em 0.6em;
  --bg: #0c111a; --surface: #131a26; --surface2: #182131; --ink: #e6ecf5; --muted: #93a2b8; --line: #263247;
  --accent: #6f9bff; --accent-soft: #1a2a4a; --accent-ink: #081225;
  --new: #43c98f; --new-soft: #12301f; --chg: #f0ad3a; --chg-soft: #33270f; --ext: #8f9cb0; --ext-soft: #1b2230;
  --bad: #f07a6e; --bad-soft: #3a1b18; --pulse: rgba(111, 155, 255, 0.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: clamp(20px, 2.6vw, 26px); line-height: 1.2; margin: 0; text-wrap: balance; font-weight: 700; }
h2 { font-size: 17px; margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 0.88em; }
button, select { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

.head { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.stat b { font-size: 17px; }
.stat.new b { color: var(--new); } .stat.chg b { color: var(--chg); }
.kindbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.kindbar span { display: block; height: 100%; }
.kindlegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.kindlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { padding: 10px 16px; border: 0; background: none; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .main { grid-template-columns: 1fr; } }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; overflow-x: auto; min-width: 0; position: relative; }
.canvas svg { display: block; width: 100%; height: auto; min-width: 640px; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 1000px) { .side { position: static; max-height: none; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding: 6px 4px 0; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border: 2px solid; }

svg .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill calc(0.2s / var(--rate, 1)), stroke calc(0.2s / var(--rate, 1)); }
svg .node.new rect, svg .node.scope rect { fill: var(--new-soft); stroke: var(--new); }
svg .node.context rect { fill: var(--surface); stroke: var(--muted); }
svg .node.context .bd { fill: var(--muted); } svg .node.scope .bd { fill: var(--new); }
svg .node.changed rect { fill: var(--chg-soft); stroke: var(--chg); }
svg .node.unchanged rect { fill: var(--surface); stroke: var(--muted); }
svg .node.unchanged .bd { fill: var(--muted); }
svg .node.external rect { fill: var(--ext-soft); stroke: var(--ext); stroke-dasharray: 5 4; }
svg .node text { fill: var(--ink); font-family: var(--font); }
/* The sizes, weights and letter-spacing below are mirrored in the measuring constants in buildMap's helpers (fitName, fitPath, countFits): change both together. */
svg .node .nm { font-weight: 600; font-size: 14px; }
svg .node .pt { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
svg .node .bd { font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; }
svg .node.new .bd { fill: var(--new); } svg .node.changed .bd { fill: var(--chg); } svg .node.external .bd { fill: var(--ext); }
svg .node { cursor: pointer; }
svg .node:hover rect { stroke-width: 2.5; }
svg .node.sel rect { stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; }
svg .node.dim rect { opacity: 0.45; } svg .node.dim text { opacity: 0.8; }
svg .node.active rect { stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; filter: drop-shadow(0 0 10px var(--pulse)); }
svg .node.seen rect { stroke-width: 2.5; }
svg .node.fail rect { stroke: var(--bad); fill: var(--bad-soft); stroke-width: 3; stroke-dasharray: none; }
svg .edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
svg .edge.uses { stroke-dasharray: 3 4; }
svg .edge.hot { stroke: var(--accent); stroke-width: 2.6; }
svg .edge.trail { stroke: var(--accent); stroke-opacity: 0.45; stroke-width: 2.2; }
svg .elabel { font-size: 10.5px; fill: var(--muted); font-family: var(--mono); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
svg .packet circle.core { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
svg .packet circle.halo { fill: var(--pulse); }
svg .packet text { fill: var(--accent-ink); font-size: 9px; font-weight: 700; font-family: var(--font); }
svg .stepno { font-size: 10px; font-weight: 700; fill: var(--accent-ink); }
svg .stepdot { fill: var(--accent); }

.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 1px 7px; border-radius: 5px; text-transform: uppercase; }
.badge.new, .badge.added, .badge.scope { background: var(--new-soft); color: var(--new); }
.badge.context { background: var(--surface2); color: var(--muted); }
.badge.changed, .badge.modified { background: var(--chg-soft); color: var(--chg); }
.badge.unchanged { background: var(--surface2); color: var(--muted); }
.badge.external { background: var(--ext-soft); color: var(--ext); }
.badge.removed { background: var(--bad-soft); color: var(--bad); }
.ref { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--line); text-decoration: none; color: var(--accent); max-width: 100%; overflow-wrap: anywhere; }
a.ref:hover { border-color: var(--accent); }
.kv { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 6px 10px; font-size: 14px; }
.kv > span:nth-child(odd) { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
.io { font-family: var(--mono); font-size: 12.5px; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.decision { padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.flist { display: flex; flex-direction: column; }
.frow { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.frow:last-child { border-bottom: 0; }
.frow .fp { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.frow .fp b { font-weight: 600; }
.frow .fp .dir { color: var(--muted); }
.frow .fj { grid-column: 2 / 4; font-size: 13.5px; }
.frow .fc { grid-column: 2 / 4; font-size: 13px; color: var(--muted); }
.lines { font-family: var(--mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lines .a { color: var(--new); } .lines .d { color: var(--bad); }
.sym { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 2 / 4; }
.sym code { background: var(--surface2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

.sim-top { display: flex; flex-direction: column; gap: 10px; }
.scen { display: flex; gap: 6px; flex-wrap: wrap; }
.scen button { padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; }
.scen button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.curl { position: relative; font-family: var(--mono); font-size: 12.5px; background: #0d1422; color: #cfe0ff; border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.curl .copy { position: absolute; top: 8px; right: 8px; font-family: var(--font); font-size: 12px; padding: 3px 9px; border-radius: 6px; border: 1px solid #2c3b57; background: #16213a; color: #cfe0ff; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0; border-bottom: 1px solid var(--line); }
.withbar .outline, .withbar .side { top: calc(var(--bar-h) + 8px); max-height: calc(100vh - var(--bar-h) - 20px); }
@media (max-width: 1000px) { .withbar .outline { top: auto; max-height: 260px; } .withbar .side { top: auto; max-height: none; } }
.btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.stepcard { display: flex; flex-direction: column; gap: 10px; animation: rise 0.25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.stephead { display: flex; gap: 10px; align-items: center; }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; }
.steplist { display: flex; flex-direction: column; gap: 2px; }
.steplist button { display: grid; grid-template-columns: 24px 96px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; padding: 6px 8px; border: 0; background: none; border-radius: 6px; font-size: 13.5px; }
.steplist button:hover { background: var(--surface2); }
.steplist button.on { background: var(--accent-soft); }
.steplist button.future { opacity: 0.45; }
.steplist .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.steplist .who { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface2); display: flex; flex-direction: column; gap: 8px; }
.result.ok { border-color: var(--new); } .result.err { border-color: var(--bad); }
.status { font-family: var(--mono); font-weight: 700; font-size: 18px; }
.result.ok .status { color: var(--new); } .result.err .status { color: var(--bad); }
.result ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input[type=search] { flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
.chip { padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.group summary { cursor: pointer; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; list-style: none; }
.group summary::-webkit-details-marker { display: none; }
.group summary h2 { font-size: 15.5px; }
.groups { display: flex; flex-direction: column; gap: 10px; }
.commits { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
.commit { display: grid; grid-template-columns: 28px 80px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.commit:last-child { border-bottom: 0; }
.empty { color: var(--muted); font-size: 14px; }
.walk { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .walk { grid-template-columns: 1fr; } }
.outline { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
@media (max-width: 1000px) { .outline { position: static; max-height: 260px; } }
.outline button { text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; }
.outline button:hover { background: var(--surface2); }
.outline button.on { background: var(--accent-soft); color: var(--ink); }
.outline button.done { color: var(--muted); }
.outline .pr { font-weight: 600; margin-top: 6px; }
.outline .it { padding-left: 22px; }
.outline .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; min-width: 18px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; animation: rise 0.25s ease-out; }
.wcard h2 { font-size: 21px; }
.crumb { font-size: 12.5px; color: var(--muted); letter-spacing: 0.04em; }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.why > div { border-radius: 10px; padding: 10px 12px; background: var(--surface2); border-left: 4px solid var(--line); font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.checklist li { overflow-wrap: anywhere; }
.whyrow { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; }
.whybtn { text-align: left; font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); }
.whybtn:hover { background: var(--accent); color: var(--accent-ink); }
code, .mono, .code, .io, .curl, .ref { font-variant-ligatures: none; }
.why .lbl { display: block; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
.why .w-why { border-left-color: var(--accent); } .why .w-pic { border-left-color: var(--new); } .why .w-mnt { border-left-color: var(--chg); } .why .w-what { border-left-color: var(--ext); }
.problem-box { border-radius: 10px; padding: 14px 16px; background: var(--bad-soft); border-left: 4px solid var(--bad); }
.solution-box { border-radius: 10px; padding: 14px 16px; background: var(--new-soft); border-left: 4px solid var(--new); }
.code { margin: 0; background: #0d1422; color: #d6e2f5; border-radius: 10px; padding: 10px 0; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; overflow-x: auto; max-height: 520px; overflow-y: auto; }
.code div { padding: 0 14px 0 30px; white-space: pre; position: relative; min-height: 1.55em; }
.code div::before { content: attr(data-p); position: absolute; left: 10px; color: #6b7a96; }
.code .add { background: rgba(67, 201, 143, 0.14); } .code .add::before { color: #43c98f; }
.code .del { background: rgba(240, 122, 110, 0.14); color: #f3b2aa; } .code .del::before { color: #f07a6e; }
.code .gap { color: #6b7a96; font-style: italic; }
.code { position: relative; scroll-behavior: smooth; }
.code .speaking { background: rgba(111, 155, 255, 0.32); box-shadow: inset 5px 0 0 #8fb1ff; color: #ffffff; transition: background calc(0.2s / var(--rate, 1)); }
.code .now::after { content: "◀ now"; position: absolute; right: 10px; color: #8fb1ff; font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
.beatbar { scroll-margin-top: calc(var(--bar-h) + 8px); display: flex; flex-direction: column; gap: 8px; border-radius: 10px; padding: 10px 12px; background: var(--accent-soft); border: 1px solid var(--accent); }
.beatdots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.beatdot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--accent); background: var(--surface); font-size: 11.5px; font-weight: 700; color: var(--accent); }
.beatdot.on { background: var(--accent); color: var(--accent-ink); }
.caption { font-size: 15.5px; line-height: 1.45; min-height: 2.9em; }
.codehead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.checklist { display: flex; flex-direction: column; gap: 14px; }
.checklist h3 { margin: 0; font-size: 15px; }
.checklist ul { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
/* Brief: the stakeholder deck. Self-contained: every rule is .dk- prefixed and uses the theme tokens only. */
.dk-wrap { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.dk-wrap.dk-present { position: fixed; inset: 0; z-index: 1000; background: var(--bg); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); overflow: hidden; }
.dk-prog { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.dk-prog i { display: block; height: 100%; background: var(--accent); transition: width 0.35s ease; }
.dk-stage { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.dk-present .dk-stage { aspect-ratio: auto; flex: 1; min-height: 0; }
/* The slide is a 1000px design canvas that script scales to the stage, so nothing scrolls; a narrow stage (.dk-fluid) lets it flow instead. */
.dk-slide { position: absolute; left: 50%; top: 50%; width: 1000px; transform: translate(-50%, -50%); transform-origin: center; font-size: 16px; display: flex; flex-direction: column; gap: 1.1em; }
.dk-fluid { aspect-ratio: auto; overflow: visible; padding: 14px; }
.dk-fluid .dk-slide { position: static; width: auto; transform: none; font-size: 14px; }
.dk-h { margin: 0; font-size: 1.7em; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.dk-big { margin: 0; font-size: 2.8em; line-height: 1.1; font-weight: 700; text-wrap: balance; }
.dk-sub { font-size: 1.3em; color: var(--muted); max-width: 40em; }
.dk-when { margin: -0.3em 0 0; font-size: 1.1em; color: var(--muted); max-width: 44em; }
/* A listed term: dotted underline; its meaning shows in the one .dk-tip of the deck on hover or focus. */
.dk-term { text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 0.22em; cursor: help; border-radius: 3px; }
.dk-term:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dk-tip { position: fixed; z-index: 1100; max-width: min(22em, calc(100vw - 16px)); padding: 0.45em 0.7em; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13.5px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25); pointer-events: none; }
